name: Build & Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt, go mod tidy and go vet make no change and report nothing
        run: |
          set -x
          go fmt ./...
          go mod tidy
          git diff --exit-code
          go vet -tags goolm ./...
  test:
    # Linux only: mtx builds with goolm and CGO_ENABLED=0 for the release binary.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 -tags goolm ./...
  conduit:
    # Real-homeserver tests (build tag conduit). Conduit runs locally from .github/conduit.toml.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: cachix/install-nix-action@v31 # pin: the nix that provides matrix-conduit
      - name: Start Conduit
        run: |
          CONDUIT_CONFIG=.github/conduit.toml nix shell nixpkgs#matrix-conduit --command conduit > conduit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:6167/_matrix/client/versions >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:6167/_matrix/client/versions >/dev/null
      - name: Register test users and export their sessions
        run: |
          TOK=$(grep -E '^registration_token' .github/conduit.toml | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          reg() {
            curl -s -X POST http://127.0.0.1:6167/_matrix/client/v3/register -H 'content-type: application/json' \
              -d "{\"username\":\"$1\",\"password\":\"$2\",\"initial_device_display_name\":\"ci\",\"auth\":{\"type\":\"m.login.registration_token\",\"token\":\"$TOK\"}}"
          }
          field() { echo "$1" | sed -E "s/.*\"$2\":\"([^\"]*)\".*/\1/"; }
          PA=$(head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 20)
          PB=$(head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 20)
          A=$(reg "ci_a$RANDOM" "$PA"); B=$(reg "ci_b$RANDOM" "$PB")
          for v in "$(field "$A" access_token)" "$(field "$B" access_token)" "$PA" "$PB"; do echo "::add-mask::$v"; done
          {
            echo "MTX_CONDUIT_HOMESERVER=http://127.0.0.1:6167"
            echo "MTX_CONDUIT_REG_TOKEN=$TOK"
            echo "MTX_CONDUIT_A_USER=$(field "$A" user_id)"
            echo "MTX_CONDUIT_A_PASSWORD=$PA"
            echo "MTX_CONDUIT_B_USER=$(field "$B" user_id)"
            echo "MTX_CONDUIT_B_PASSWORD=$PB"
          } >> "$GITHUB_ENV"
      - name: Real-homeserver tests
        run: go test -tags "goolm conduit" -count=1 -timeout 180s -run TestConduit ./internal/matrix/
      - name: Conduit log on failure
        if: failure()
        run: cat conduit.log
